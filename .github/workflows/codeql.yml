name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published rule finds old code without waiting for a push.
    - cron: '17 4 * * 1'

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-15
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift

      - name: Build for analysis
        run: |
          xcodebuild build \
            -project privamesh.xcodeproj \
            -scheme privamesh \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
